name: CI

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
    branches: ["**"]

env:
  PIP_CACHE_DIR: .cache/pip
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: .cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev]"

      - name: Run pytest
        run: python -m pytest --junitxml=pytest-report.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: pytest-report.xml

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: python-tests
    if: github.event_name == 'push' && (github.ref_type == 'branch' || github.ref_type == 'tag')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Set image tags
        id: meta
        # github.ref_name reaches the shell through env, never through ${{ }}.
        # A ${{ }} expression is substituted into the script BEFORE bash parses
        # it, so the ref name would be read as shell source. Git allows $, `,
        # ;, | and & in branch names (it forbids spaces, ~, ^, :, ?, *, [ and
        # \), so a branch named a$(...) executed arbitrary commands in this
        # runner -- which holds packages: write and a GHCR login. Only someone
        # with push access can create such a branch, so this was not remotely
        # exploitable, but it turned "can push a branch" into "can run code in
        # CI", and that is not a step anyone should get for free.
        #
        # Through env the value is passed as data and quoting it at each use is
        # enough. Keep it that way: if you add another github.* value here, add
        # it to env rather than inlining the expression.
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REF_SLUG=$(printf '%s' "$REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          # THIS fork's namespace, not upstream's (76696265636f646572/airwave).
          # secrets.GITHUB_TOKEN is scoped to this repository and can never
          # write to another account's packages, so the inherited name failed
          # on every push to main. Keep this on p-i-e-r-c-i-n-g-s when merging
          # upstream. Must stay lowercase -- GHCR rejects uppercase paths.
          REPO_LOWER="p-i-e-r-c-i-n-g-s/pearwave"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ]; then
            echo "ghcr.io/${REPO_LOWER}:${REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "ghcr.io/${REPO_LOWER}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "ghcr.io/${REPO_LOWER}:${REF_SLUG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            if [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "master" ]; then
              echo "ghcr.io/${REPO_LOWER}:latest" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"
    
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          file: ./Dockerfile
